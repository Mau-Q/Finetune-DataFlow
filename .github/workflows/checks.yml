name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate component pins and public files
        run: python scripts/check-workspace.py
      - name: Check shell syntax
        run: bash -n scripts/setup.sh && sh -n scripts/webui.sh scripts/dev.sh scripts/test-local.sh
      - name: Check whitespace
        run: git diff --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repos/dataflow-webui/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: repos/dataflow-webui/frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend contract tests
        working-directory: repos/dataflow-webui/frontend
        run: npm test
      - name: Build
        working-directory: repos/dataflow-webui/frontend
        run: npm run build
  windows-persistence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated persistence test dependencies
        run: python -m pip install loguru pydantic-settings Pillow pypdf pyyaml fastapi httpx uvicorn
      - name: Test Windows file locking and backup restore
        working-directory: repos/dataflow-webui/backend
        run: python -m unittest discover -s platform_tests -v
      - name: Test Windows PowerShell 5.1 scripts
        shell: powershell
        run: .\scripts\test-windows.ps1
      - name: Test PowerShell 7 scripts
        shell: pwsh
        run: .\scripts\test-windows.ps1

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: locks/review-tests.txt
      - name: Install CPU regression dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r locks/review-tests.txt
      - name: Run Core optional dependency regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/repos/dataflow
        run: python -m pytest repos/dataflow/test/cpu_only/test_lightrag_optional.py -q
      - name: Run backend failure, competition and storage regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/repos/dataflow-webui/backend:${{ github.workspace }}/repos/dataflow
        run: python -m pytest repos/dataflow-webui/backend/tests/test_review_repairs.py repos/dataflow-webui/backend/tests/test_dataset_database.py repos/dataflow-webui/backend/tests/test_training_lifecycle.py repos/dataflow-webui/backend/tests/test_model_training.py repos/dataflow-webui/backend/tests/test_training_ssh.py repos/dataflow-webui/backend/tests/test_resource_conflicts.py -q
