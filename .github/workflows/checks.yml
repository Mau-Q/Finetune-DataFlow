name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate component pins and public files
        run: python scripts/check-workspace.py
      - name: Check shell syntax
        run: bash -n scripts/setup.sh && sh -n scripts/webui.sh scripts/test-local.sh
      - name: Check whitespace
        run: git diff --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repos/dataflow-webui/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: repos/dataflow-webui/frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend contract tests
        working-directory: repos/dataflow-webui/frontend
        run: npm test
      - name: Build
        working-directory: repos/dataflow-webui/frontend
        run: npm run build
  windows-persistence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated persistence test dependencies
        run: python -m pip install loguru pydantic-settings Pillow pypdf pyyaml
      - name: Test Windows file locking and backup restore
        working-directory: repos/dataflow-webui/backend
        run: python -m unittest discover -s platform_tests -v
      - name: Test Windows PowerShell 5.1 scripts
        shell: powershell
        run: .\scripts\test-windows.ps1
      - name: Test PowerShell 7 scripts
        shell: pwsh
        run: .\scripts\test-windows.ps1
